name: portable-release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -EQ 'codex-copilot').version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version."
          }
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target '${{ matrix.target }}'
      - name: Test release binary (native x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo test --locked --release --target '${{ matrix.target }}' --target-dir target/portable
      - name: Smoke test portable executable (native x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable version check failed.' }
          & $exe.FullName --help
          if ($LASTEXITCODE -ne 0) { throw 'Portable help check failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "codex-copilot") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            exit 1
          fi
      - name: Build portable binary
        run: ./scripts/package-macos.sh '${{ matrix.target }}'
      - name: Test release binary (native arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked --release --target '${{ matrix.target }}' --target-dir target/portable
      - name: Smoke test portable binary (native arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          binary=$(ls dist/codex-copilot-*-macos-arm64)
          "$binary" --version
          "$binary" --help
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/codex-copilot-*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
